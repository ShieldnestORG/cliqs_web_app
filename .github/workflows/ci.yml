on:
  # Push to long living branches or PRs
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
      - run: npm ci
      - run: npm run lint

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
      - run: npm ci
      - run: npm run format:check

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
      - run: npm ci
      # jest only. `npm run test:ci` starts with the house-style gate, which reads the private house-style checkout
      # (HOUSE_STYLE, default /Users/exe/Downloads/Claude/house-style) and so failed here on every run since #95
      # (2026-10-12), before jest ever started. That gate runs on the Mac or the tower (owner 2026-10-12: never
      # GitHub Actions); run `npm run test:ci` locally before a pull request (CLAUDE.md section 5).
      - run: npx jest

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
      - run: npm ci
      - run: cp .env.sample .env.local
      - run: npm run build

  # Fails the build on a known-vulnerable dependency at high or critical severity.
  # Dependabot alerts on the default branch are after-the-fact; this blocks the PR
  # that would introduce one. Moderate and low are reported without failing, so a
  # transitive advisory with no upgrade path cannot wedge every PR in the repo.
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
      - run: npm ci
      - name: Fail on high/critical advisories
        run: npm audit --audit-level=high
      - name: Report moderate and low (non-blocking)
        if: always()
        run: npm audit --audit-level=low || true
