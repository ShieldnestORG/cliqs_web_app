on:
  # Push to long living branches or PRs
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 24
          cache: "npm"
      - run: npm ci
      - run: npm run lint

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 24
          cache: "npm"
      - run: npm ci
      - run: npm run format:check

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 24
          cache: "npm"
      - run: npm ci
      - run: npm run test:ci

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 24
          cache: "npm"
      - run: npm ci
      - run: cp .env.sample .env.local
      - run: npm run build

  # Fails the build on a known-vulnerable dependency at high or critical severity.
  # Dependabot alerts on the default branch are after-the-fact; this blocks the PR
  # that would introduce one. Moderate and low are reported without failing, so a
  # transitive advisory with no upgrade path cannot wedge every PR in the repo.
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 24
          cache: "npm"
      - run: npm ci
      - name: Fail on high/critical advisories
        run: npm audit --audit-level=high
      - name: Report moderate and low (non-blocking)
        if: always()
        run: npm audit --audit-level=low || true
